<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lumen">
  <defs>
    <radialGradient id="lmCore" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#FFD9A8"/>
      <stop offset="38%" stop-color="#FF8A2B"/>
      <stop offset="100%" stop-color="#C0480C"/>
    </radialGradient>
    <radialGradient id="lmHalo" cx="38%" cy="32%" r="60%">
      <stop offset="55%" stop-color="#FF8A2B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF8A2B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Aperture: the source is the mark. An L is implied by the corner it sits in,
       so the letter never has to compete with the light. -->
  <circle cx="32" cy="30" r="26" fill="url(#lmHalo)"/>
  <circle cx="32" cy="30" r="15" fill="url(#lmCore)"/>
  <path d="M14 12 v34 h20" fill="none" stroke="currentColor" stroke-width="5"
        stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
